<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account – Grand Meridian</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="auth">
<aside class="auth-side"><div><h1>Grand Meridian</h1><p>Book your room in a few clicks and manage every stay in one place.</p></div><ul><li>Standard, Deluxe and Suite rooms</li><li>Instant confirmation, no double bookings</li><li>Free cancellation up to 2 days before check-in</li></ul></aside>
<main class="auth-main">
  <form class="auth-form" id="authForm" data-mode="register" novalidate>
    <h2>Create your account</h2>
    <p class="muted">It takes less than a minute.</p>
    <div class="stackf">
      <div id="error" class="error" role="alert" hidden></div>
      <label class="field">Full name <input id="fullName" autocomplete="name" autofocus></label>
      <label class="field">Phone number <input id="phone" inputmode="tel" autocomplete="tel"></label>
      <label class="field">Username <input id="username" autocomplete="username" placeholder="Letters, numbers, underscore"></label>
      <div class="grid2">
        <label class="field">Password <input id="password" type="password" autocomplete="new-password" placeholder="6+ characters"></label>
        <label class="field">Confirm <input id="confirm" type="password" autocomplete="new-password"></label>
      </div>
    </div>
    <button class="btn primary block" id="submit">Create account</button>
    <p class="alt">Already registered? <a href="login.html">Sign in</a></p>
  </form>
</main>
</div>
<script src="auth.js"></script>
</body></html>
